<div class="error">
    <div class="error__img-wrapper">
        <img
            [src]="routeData.imgSrc"
            [alt]="routeData.imgAlt"
            class="error__img"
        />
    </div>
    <div class="error__text">
        <h1 class="mat-headline-1">{{ routeData.label }}</h1>
        <p class="mat-subtitle-1">{{ routeData.message }}</p>
        <app-button
            label="Go back home"
            class="error__btn"
            routerLink="{{ routes.DASHBOARD }}"
        ></app-button>
    </div>
</div>
