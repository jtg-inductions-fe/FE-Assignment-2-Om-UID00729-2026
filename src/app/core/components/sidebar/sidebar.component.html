<div class="sideNav">
    <div class="sideNav__links-container">
        <mat-tree
            [dataSource]="dataSource"
            [treeControl]="treeControl"
            class="sideNav__tree"
        >
            <mat-tree-node
                *matTreeNodeDef="let node; when: isLink"
                matTreeNodeToggle
                class="sideNav__link-wrapper"
            >
                <a
                    [routerLink]="node.routeTo"
                    class="sideNav__link mat-headline-4"
                    routerLinkActive="sideNav__link-active"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                    <mat-icon *ngIf="node.icon">{{ node.icon }}</mat-icon>
                    <p class="sideNav__link-label">
                        {{ node.label }}
                    </p>
                    <span
                        *ngIf="node.hasBadge"
                        matBadge="1"
                        matBadgeColor="warn"
                    ></span>
                </a>
            </mat-tree-node>

            <mat-tree-node
                *matTreeNodeDef="let node; when: isDivider"
                class="sideNav__link-wrapper sideNav__divider"
            >
                <mat-divider> </mat-divider
            ></mat-tree-node>

            <mat-nested-tree-node
                *matTreeNodeDef="let node; when: hasChild"
                class="sideNav__link-wrapper"
            >
                <div>
                    <button
                        matTreeNodeToggle
                        type="button"
                        [attr.aria-label]="'Toggle ' + node.label"
                        class="sideNav__drop-down-btn"
                    >
                        <div class="sideNav__link mat-headline-4">
                            <mat-icon *ngIf="node.icon">{{
                                node.icon
                            }}</mat-icon>
                            <p class="sideNav__link-label">
                                {{ node.label }}
                            </p>
                            <mat-icon>
                                {{
                                    treeControl.isExpanded(node)
                                        ? 'expand_less'
                                        : 'expand_more'
                                }}
                            </mat-icon>
                        </div>
                    </button>
                </div>
                <div
                    [class.sideNav__link-hidden]="!treeControl.isExpanded(node)"
                    class="sideNav__nested-link"
                >
                    <ng-container matTreeNodeOutlet></ng-container>
                </div>
            </mat-nested-tree-node>
        </mat-tree>
    </div>

    <div class="sideNav__bottom-tray">
        <a
            routerLink="/settings"
            class="mat-headline-4"
            *ngFor="let icon of trayIcons; trackBy: trackByTrayIcons"
        >
            <mat-icon>{{ icon }}</mat-icon>
        </a>
    </div>
</div>
