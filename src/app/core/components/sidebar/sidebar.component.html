<div class="sidebar">
    <mat-drawer-container class="sidebar__container" autosize>
        <mat-drawer
            #drawer
            class="sidebar__mat-drawer"
            [mode]="isdesktop ? 'side' : 'over'"
            [opened]="isdesktop"
            *ngIf="authService.isLoggedIn()"
        >
            <div class="sidebar__drawer-container">
                <div class="sidebar__links-container">
                    <mat-tree
                        [dataSource]="dataSource"
                        [treeControl]="treeControl"
                        class="sidebar__nav-tree"
                    >
                        <mat-tree-node
                            *matTreeNodeDef="let node; when: isLink"
                            matTreeNodeToggle
                            class="sidebar__link-wrapper"
                        >
                            <a
                                routerLink="{{ node.routeTo }}"
                                class="sidebar__link mat-headline-4"
                                routerLinkActive="sidebar__link-active"
                                [routerLinkActiveOptions]="{ exact: true }"
                            >
                                <mat-icon *ngIf="node.icon">{{
                                    node.icon
                                }}</mat-icon>
                                <p class="sidebar__link-label">
                                    {{ node.label }}
                                </p>
                                <span
                                    *ngIf="node.hasBadge"
                                    matBadge="1"
                                    matBadgeColor="warn"
                                ></span>
                            </a>
                        </mat-tree-node>

                        <mat-tree-node
                            *matTreeNodeDef="let node; when: isDivider"
                            class="sidebar__link-wrapper sidebar__divider"
                        >
                            <mat-divider> </mat-divider
                        ></mat-tree-node>

                        <mat-nested-tree-node
                            *matTreeNodeDef="let node; when: hasChild"
                            class="sidebar__link-wrapper"
                        >
                            <div>
                                <button
                                    matTreeNodeToggle
                                    type="button"
                                    [attr.aria-label]="'Toggle ' + node.label"
                                    class="sidebar__drop-down-btn"
                                >
                                    <div class="sidebar__link mat-headline-4">
                                        <mat-icon *ngIf="node.icon">{{
                                            node.icon
                                        }}</mat-icon>
                                        <p class="sidebar__link-label">
                                            {{ node.label }}
                                        </p>
                                        <mat-icon>
                                            {{
                                                treeControl.isExpanded(node)
                                                    ? 'expand_less'
                                                    : 'expand_more'
                                            }}
                                        </mat-icon>
                                    </div>
                                </button>
                            </div>
                            <div
                                [class.sidebar__link-hidden]="
                                    !treeControl.isExpanded(node)
                                "
                                class="sidebar__nested-link"
                            >
                                <ng-container matTreeNodeOutlet></ng-container>
                            </div>
                        </mat-nested-tree-node>
                    </mat-tree>
                </div>

                <div class="sidebar__bottom-tray">
                    <a
                        routerLink="/settings"
                        class="sidebar__link mat-headline-4"
                    >
                        <mat-icon>settings</mat-icon>
                    </a>
                    <a
                        routerLink="/settings"
                        class="sidebar__link mat-headline-4"
                    >
                        <mat-icon>public</mat-icon>
                    </a>
                    <a
                        routerLink="/settings"
                        class="sidebar__link mat-headline-4"
                    >
                        <mat-icon>tune</mat-icon>
                    </a>
                </div>
            </div>
        </mat-drawer>

        <mat-drawer-content class="sidebar__content">
            <router-outlet></router-outlet>
        </mat-drawer-content>
    </mat-drawer-container>
</div>
