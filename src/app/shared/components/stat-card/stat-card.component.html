<mat-card class="stat-card">
    <mat-card-content class="stat-card__container">
        <div class="stat-card__details">
            <p class="mat-subtitle-2">{{ label }}</p>
            <h2 class="mat-headline-2">{{ value }}</h2>
        </div>
        <mat-icon class="stat-card__icon">{{ icon }}</mat-icon>
    </mat-card-content>
</mat-card>
