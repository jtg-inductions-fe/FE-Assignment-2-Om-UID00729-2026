<table mat-table [dataSource]="dataSource">
    <ng-container
        *ngFor="let column of columns"
        [matColumnDef]="column.key"
        [ngSwitch]="column.type"
    >
        <th mat-header-cell *matHeaderCellDef class="table__header">
            {{ column.header }}
        </th>

        <td mat-cell *matCellDef="let row">
            <ng-container [ngSwitch]="column.type" class="table__cell">
                <div *ngSwitchCase="'button'" class="table__buttons">
                    <app-button
                        *ngFor="let action of row['actions']"
                        [iconLabel]="action.icon"
                        [label]="action.label"
                        [variant]="action.variant"
                    ></app-button>
                </div>
                <span *ngSwitchDefault>{{ row[column.key] }}</span>
            </ng-container>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
