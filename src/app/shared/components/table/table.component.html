<table mat-table [dataSource]="dataSource">
    <ng-container
        *ngFor="let column of columns; trackBy: trackByColumns"
        [matColumnDef]="column.key"
    >
        <th
            mat-header-cell
            *matHeaderCellDef
            class="mat-body-2 table__heading"
            [ngClass]="getHeadingAlignment(column.headingAlignment)"
        >
            {{ column.header }}
        </th>

        <td
            mat-cell
            *matCellDef="let row"
            class="table__data"
            [ngClass]="column.textClass ?? ''"
        >
            <ng-container *ngIf="column.type === 'template'; else textCell">
                <ng-container
                    *ngTemplateOutlet="
                        templates[column.key];
                        context: { $implicit: row }
                    "
                ></ng-container>
            </ng-container>
            <ng-template #textCell>{{ row[column.key] }}</ng-template>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
