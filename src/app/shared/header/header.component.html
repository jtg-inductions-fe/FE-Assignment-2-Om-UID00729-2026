<mat-toolbar class="header">
    <a routerLink="/" class="logo-container">
        <img src="assets/favicon.svg" alt="Company Logo" />
    </a>

    <ng-container *ngIf="authservice.currUser$ | async as user">
        <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            aria-label="User profile menu"
            class="header__profile-btn"
        >
            <img
                src="{{ user.profileImg }}"
                alt="Company Logo"
                class="header__profile-img"
            />
        </button>

        <mat-menu #menu="matMenu">
            <div class="mat-body-1 header__menu-email">{{ user.email }}</div>
            <mat-divider></mat-divider>
            <app-button
                label="LOGOUT"
                class="header__menu-btn"
                (click)="logout()"
            ></app-button>
        </mat-menu>
    </ng-container>
</mat-toolbar>
