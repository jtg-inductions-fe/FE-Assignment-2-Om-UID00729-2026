<form [formGroup]="loginForm" class="login__form">
    <mat-form-field appearance="outline" class="login__form-item">
        <mat-label>Address</mat-label>

        <input matInput [type]="'text'" formControlName="address" />
        <mat-error>
            {{ getTextError() }}
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="login__form-item">
        <mat-label>Address</mat-label>

        <input matInput [type]="'text'" formControlName="address" />
        <mat-error>
            {{ getTextError() }}
        </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="login__form-item">
        <mat-label>Email Address</mat-label>
        <input
            matInput
            type="email"
            formControlName="email"
            placeholder="xyz@jtg.com"
        />

        <mat-error>
            {{ getEmailError() }}
        </mat-error>
    </mat-form-field>
</form>
