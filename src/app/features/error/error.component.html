<div class="error">
    <div class="error__img-wrapper">
        <img src="{{ imgSrc }}" alt="{{ imgAlt }}" class="error__img" />
    </div>
    <div class="error__text">
        <h1 class="mat-headline-1">{{ label }}</h1>
        <p class="mat-subtitle-1">{{ message }}</p>
        <app-button
            label="Go back home"
            class="error__btn"
            routerLink="/auth/login"
        ></app-button>
    </div>
</div>
