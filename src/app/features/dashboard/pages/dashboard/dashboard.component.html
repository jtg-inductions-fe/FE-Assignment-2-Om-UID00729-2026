<div class="dashboard">
    <app-heading
        [heading]="'Overview Dashboard'"
        [subHeading]="'System administrator overview panel. Impersonate owners or view aggregate metrics.'"
    ></app-heading>
    <app-stat-card
        [label]="'Total Revenue'"
        [value]="'$200'"
        [icon]="'attach_money'"
    ></app-stat-card>

    <div class="dashboard__report">
        <app-card-container
            [heading]="'Top Customers'"
            class="dashboard__top-customers"
        >
            <app-item-card
                *ngFor="let customer of topCustomers"
                [label]="customer.name"
                [subtitle]="customer.email"
                [imageUrl]="customer.profileImg!"
                [value]="'$' + customer.totalAmount"
            ></app-item-card>
        </app-card-container>
        <app-card-container
            [heading]="'Top Orders'"
            class="dashboard__top-orders"
        >
            <app-item-card
                *ngFor="let item of topOrders"
                [label]="item.dishName"
                [subtitle]="item.restaurant"
                [value]="item.orders + ' orders'"
            ></app-item-card>
        </app-card-container>
    </div>
</div>
