<div class="dashboard">
    <app-heading
        [heading]="'Overview Dashboard'"
        [subHeading]="'System administrator overview panel. Impersonate owners or view aggregate metrics.'"
    >
        <app-autocomplete *ngIf="isAdmin"></app-autocomplete>
    </app-heading>

    <div class="dashboard__stat-container">
        <app-stat-card
            class="dashboard__stat-card"
            *ngFor="let stat of stats"
            [label]="stat.label"
            [value]="stat.value"
            [icon]="stat.icon"
        ></app-stat-card>
    </div>

    <div class="dashboard__report-content-wrapper">
        <div class="dashboard__report-text-content">
            <h5 class="mat-headline-5">Report Generator</h5>
            <p class="mat-subtitle-2">
                Generate performance reports for the selected restaurant
                context.
            </p>
        </div>
        <div class="dashboard__report-buttons">
            <app-button
                [variant]="'stroked'"
                [label]="'Top 10 Ordered Items'"
                [iconLabel]="'bar_chart'"
            ></app-button>
            <app-button
                [label]="'Frequently Bought Together'"
                [iconLabel]="'group_work'"
            ></app-button>
        </div>
    </div>

    <div class="dashboard__data-wrapper">
        <app-card-container
            [heading]="'Top Customers'"
            class="dashboard__top-customers"
        >
            <app-item-card
                *ngFor="let customer of topCustomers"
                [label]="customer.name"
                [subtitle]="customer.email"
                [imageUrl]="customer.profileImg!"
                [value]="'$' + customer.totalAmount"
            ></app-item-card>
        </app-card-container>

        <app-card-container
            [heading]="'Top Orders'"
            class="dashboard__top-orders"
        >
            <app-item-card
                *ngFor="let item of topOrders"
                [label]="item.dishName"
                [subtitle]="item.restaurant"
                [value]="item.orders + ' orders'"
            ></app-item-card>
        </app-card-container>
    </div>
</div>
